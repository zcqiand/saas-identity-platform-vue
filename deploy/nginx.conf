# ch43 完整 nginx.conf（覆盖 node:alpine 镜像默认配置）
# 必须包含 http {} 块（conf.d/*.conf 默认没被 include），所以直接覆盖 /etc/nginx/nginx.conf。
#
# - / → vite web (5173),SPA fallback try_files
# - /api/, /sso/ → vite dev-api (5174),OAuth + 业务 API + CORS

worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream vite_web {
        server 127.0.0.1:5173;
        keepalive 8;
    }

    upstream dev_api {
        server 127.0.0.1:5174;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        server_name _;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1024;

        # /api/* /sso/* → dev-api (OAuth + 业务) + CORS
        # 必须比 location / 优先匹配
        location /api/ {
            # 剥 /api/ 前缀,dev-api 路由直接 /sso/authorize 等（对齐 react-id nginx 配置）
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://dev_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # CORS：动态反射 Origin + Vary + Credentials + 预检 204
            add_header Access-Control-Allow-Origin      $http_origin    always;
            add_header Access-Control-Allow-Credentials true            always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
            add_header Vary                              "Origin"       always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location /sso/ {
            # /sso/ → dev-api /sso/（不剥前缀,dev-api 路由就是 /sso/authorize）
            proxy_pass http://dev_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # SSO 端点也允许跨域（lab-vue / react-lab 浏览器跳授权）
            add_header Access-Control-Allow-Origin      $http_origin    always;
            add_header Access-Control-Allow-Credentials true            always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
            add_header Vary                              "Origin"       always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # 其它 → vite web (SPA + HMR)
        location / {
            proxy_pass http://vite_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}