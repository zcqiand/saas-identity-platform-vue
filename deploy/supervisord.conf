; supervisord 配置（ch43）：容器内同时跑 nginx + vite web + dev-api
;
; 三进程：
;   1. nginx (80) — 对外端口，转发 SPA / /api/ /sso/
;   2. vite web (5173) — dev-server 前端,支持 HMR + SPA fallback
;   3. dev-api (5174) — tsx watch dev-server/server.ts,OAuth + 业务 API
;
; npm run dev 用 concurrently 跑 web + api,这里分两个 supervisor program 各自拉,
; supervisord 能独立看门狗——web/api 任一挂掉 nginx 上游立即 502,但容器整体不退出。

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vite-web]
directory=/app
command=npm run dev:web
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; vite 起 :5173 后 nginx 才健康,延迟 15s
startsecs=15

[program:dev-api]
directory=/app
command=npm run dev:api
priority=21
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; tsx watch dev-server/server.ts 起 :5174,OAuth handler 注册完成后 /sso/authorize 才返 302,
; 延迟 10s 足够
startsecs=10

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface